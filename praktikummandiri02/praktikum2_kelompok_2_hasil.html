<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hasil Pembelian iPhone</title>
</head>
<body>
  <nav>
    <a href="#">Home</a> |
    <a href="#">Daftar</a> |
    <a href="#">Kebijakan</a> |
    <a href="#">Tentang</a>
  </nav>
  <hr>

  <form action="#" method="post">
  <table>
    <tr>
      <td rowspan="11" valign="top">
        <img src="images/iphone.jpg" alt="Foto iPhone" width="220" height="220">
      </td>
      <td align="right" nowrap>Nama HP :</td>
      <td>iPhone 15</td>
    </tr>
    <tr>
      <td align="right" valign="top" nowrap>Deskripsi :</td>
      <td>Tahun : 2023<br>Model : iPhone 15 128 GB<br>Kondisi : Baru</td>
    </tr>
    <tr>
      <td align="right" nowrap>Total Bayar :</td>
      <td>Rp13.999.000</td>
    </tr>
    <tr>
      <td align="right" nowrap>Bayar ke :</td>
      <td>123-456-789-0</td>
    </tr>
    <tr>
      <td align="right" nowrap><label for="tipe">Metode Bayar :</label></td>
      <td>
        <select id="tipe" name="tipe">
          <option>Transfer Bank</option>
          <option>Kartu Debit</option>
          <option>E-Wallet</option>
        </select>
      </td>
    </tr>
    <tr>
      <td align="right" nowrap><label for="pemilik">Nama Pemilik :</label></td>
      <td><input type="text" id="pemilik" name="pemilik" placeholder="Nama lengkap" size="30"></td>
    </tr>
    <tr>
      <td align="right" nowrap><label for="noakun">No. Rekening :</label></td>
      <td><input type="text" id="noakun" name="noakun" value="123-456-789-0" size="30"></td>
    </tr>
    <tr>
      <td></td>
      <td>
        <input type="checkbox" id="c1" checked><label for="c1">Kirim ke No. HP</label><br>
        <input type="checkbox" id="c2" checked><label for="c2">Kirim salinan transaksi ke email</label>
      </td>
    </tr>
    <tr>
      <td align="right" nowrap><label for="hp">No. HP :</label></td>
      <td><input type="text" id="hp" name="hp" value="081234567890, 081234567891" size="30"></td>
    </tr>
    <tr>
      <td align="right" nowrap><label for="email">Email :</label></td>
      <td><input type="text" id="email" name="email" value="mahasiswa@sttnf.ac.id, user@gmail.com" size="30"></td>
    </tr>
    <tr>
      <td></td>
      <td><input type="submit" value="Bayar Sekarang"></td>
    </tr>
  </table>
  </form>
</body>
</html>
